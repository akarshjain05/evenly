<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F6" id="meta-theme-color" />
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('meta-theme-color').setAttribute('content', '#1c2622');
    }
  })();
</script>
<meta name="description" content="A private running tab for a small group - split costs, see who owes who, settle up." />
<title>Evenly — split costs with your people</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="auth-app" class="app auth-screen hidden">
  <button class="icon-btn theme-toggle-btn" style="position: absolute; top: 16px; right: 20px; z-index: 10;" aria-label="Toggle Theme"></button>
  <div class="auth-mark" style="color: var(--brass);">
    <svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="#C19A5B" stroke-width="3" stroke-linecap="round">
          <line x1="10" y1="8" x2="10" y2="32"/><line x1="16" y1="8" x2="16" y2="32"/>
          <line x1="22" y1="8" x2="22" y2="32"/><line x1="28" y1="8" x2="28" y2="32"/>
          <line x1="7" y1="30" x2="31" y2="10"/>
        </svg>
  </div>
  <h1 class="auth-title">Evenly</h1>
  <p class="auth-sub" id="auth-subtitle" style="margin-top: 0;">Sign in to your account</p>
  
  <form id="auth-form" class="auth-card">
    <div id="auth-error" class="error-msg" style="display:none; text-align: center;"></div>
    <div class="field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="auth-password">Password</label>
      <div style="position: relative; display: flex; align-items: center;">
        <input type="password" id="auth-password" placeholder="••••••••" required minlength="6" style="width: 100%; padding-right: 40px;" />
        <button type="button" id="auth-password-toggle" style="position: absolute; right: 8px; background: none; border: none; padding: 4px; cursor: pointer; color: var(--ink-soft); display: flex;">
          <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>
    <div class="field" id="auth-confirm-field" style="display: none;">
      <label for="auth-confirm-password">Confirm Password</label>
      <input type="password" id="auth-confirm-password" placeholder="••••••••" minlength="6" />
    </div>
    <button type="submit" class="btn-primary" id="auth-submit" style="margin-top: 8px;">Sign In</button>
  </form>
  
  <div style="text-align:center; font-size: 15px; margin-top: -8px;">
    <a href="#" id="auth-toggle" style="color: var(--on-dark-soft); text-decoration: none;">Need an account? Register</a>
  </div>
</div>
<div id="app" class="app hidden"></div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for(let registration of registrations) {
      registration.unregister();
    }
  });
}
</script>
</body>
</html>
