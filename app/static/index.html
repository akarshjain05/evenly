<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c2622" />
<meta name="description" content="A private running tab for a small group - split costs, see who owes who, settle up." />
<title>Evenly — split costs with your people</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="auth-app" class="app auth-screen" style="display:none; margin: 0 auto; max-width: 440px;">
  <div class="auth-mark" style="color: var(--brass);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 6 8 4 8 20 5 18"></polyline><line x1="8" y1="4" x2="18" y2="20"></line><line x1="8" y1="20" x2="18" y2="4"></line></svg>
  </div>
  <h1 class="auth-title">Evenly</h1>
  <p class="auth-sub" id="auth-subtitle">Sign in to your account</p>
  
  <form id="auth-form" class="auth-card">
    <div id="auth-error" class="error-msg" style="display:none; text-align: center;"></div>
    <div class="field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" required minlength="6" />
    </div>
    <button type="submit" class="btn-primary" id="auth-submit" style="margin-top: 8px;">Sign In</button>
  </form>
  
  <div style="text-align:center; font-size: 15px; margin-top: -8px;">
    <a href="#" id="auth-toggle" style="color: var(--on-dark-soft); text-decoration: none;">Need an account? Register</a>
  </div>
</div>
<div id="app"  class="app"></div>
<script src="app.js"></script>
</body>
</html>
