name: CI
# NOTE: Enable GitHub branch protection on 'main' with required status checks
# to prevent merging when CI is red. Configure in: Settings > Branches > Branch protection rules.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Node dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Backend Tests (Pytest)
      run: pytest tests/ -v
      
    - name: Run Frontend Typecheck (tsc)
      working-directory: ./frontend
      run: npx tsc -b
      
    - name: Run Frontend Linter (oxlint)
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run Frontend Tests (Vitest)
      working-directory: ./frontend
      run: npm run test

    - name: Run Python Security Scan (Bandit)
      run: |
        pip install bandit
        bandit -r app/ -ll -q

    - name: Run npm audit
      working-directory: ./frontend
      run: npm audit --audit-level=high || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
